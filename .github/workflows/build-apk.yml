name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Build
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: |
          for i in 1 2 3; do gradle --no-daemon :app:assembleDebug && break || sleep 10; done
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk mawj-albarq.apk
      - name: update.json
        run: |
          echo '{"versionCode":${{ github.run_number }},"url":"https://github.com/probader671-lab/mawj-albarq/releases/download/demo/mawj-albarq.apk"}' > update.json
      - name: guard against publishing an older build over a newer one
        id: guard
        run: |
          cur=$(curl -s https://api.github.com/repos/${{ github.repository }}/releases/tags/demo | grep -o 'versionCode=[0-9]*' | head -1 | cut -d= -f2)
          if [ -n "$cur" ] && [ "$cur" -gt "${{ github.run_number }}" ]; then echo "skip=true" >> $GITHUB_OUTPUT; fi
      - uses: softprops/action-gh-release@v2
        if: steps.guard.outputs.skip != 'true'
        with:
          tag_name: demo
          name: موج البرق - نسخة تجريبية
          prerelease: true
          body: "versionCode=${{ github.run_number }}"
          files: |
            mawj-albarq.apk
            update.json
