name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Build
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: |
          for i in 1 2 3; do gradle --no-daemon :app:assembleDebug && break || sleep 10; done
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk mawj-albarq.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: demo
          name: موج البرق - نسخة تجريبية
          prerelease: true
          body: "versionCode=${{ github.run_number }}"
          files: mawj-albarq.apk
