name: PR build (test only)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Build
        env:
          BUILD_VERSION_CODE: ${{ github.run_number }}
        run: |
          for i in 1 2 3; do gradle --no-daemon :app:assembleDebug && break || sleep 10; done
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk mawj-albarq-pr.apk
      - uses: actions/upload-artifact@v4
        with:
          name: mawj-albarq-pr-apk
          path: mawj-albarq-pr.apk
          retention-days: 7
