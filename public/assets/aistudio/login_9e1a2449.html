<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - PageBook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
    <style>
        /* Specific styles for login.html */
        :root {
            --primary: #ff6b6b;
            --secondary: #ee5a52;
            --accent: #4facfe;
            --dark-bg: #0f0f0f;
            --card-bg: rgba(30, 30, 30, 0.6);
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        /* Design Switcher */
        .design-switcher {
            position: fixed;
            top: 20px;
            right: 80px;
            z-index: 10000;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .design-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            background: rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: bold;
        }

        .design-btn:hover, .design-btn.active {
            background: var(--primary);
            transform: scale(1.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background Orbs */
        .background-orbs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: floatOrb 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #ff6b6b, transparent);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent), transparent);
            bottom: -150px;
            right: -100px;
            animation-delay: -5s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #764ba2, transparent);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
            opacity: 0.4;
        }

        @keyframes floatOrb {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* Flip Card Structure */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 400px;
            perspective: 1000px; /* Enable 3D space */
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            min-height: 600px; /* Ensure height for both forms */
            text-align: center;
            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .login-container.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .login-card-front, .login-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 30px 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-card-back {
            transform: rotateY(180deg);
        }

        .card-decoration {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(270deg, #ff6b6b, #4facfe, #ff6b6b);
            background-size: 200% 100%;
            border-radius: 24px 24px 0 0;
            animation: gradientMove 3s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Logo/Icon */
        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 25px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255,255,255,0.2);
            position: relative;
        }

        .logo-container i {
            font-size: 32px;
            background: linear-gradient(135deg, #ff6b6b, #4facfe);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.2), transparent);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, #ddd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 40px;
        }

        /* Inputs */
        .input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
            font-family: 'Cairo', sans-serif;
            transition: border-color 0.3s;
        }
        
        .input-field:focus {
            border-color: var(--primary);
        }

        .input-wrapper i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* Buttons */
        .submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Cairo', sans-serif;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        /* Google Button */
        .google-btn {
            width: 100%;
            height: 50px;
            background: #ffffff;
            color: #333;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 700;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .google-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.1);
        }

        .google-btn i {
            color: #DB4437;
            font-size: 20px;
        }

        /* Footer */
        .footer-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            margin-top: 15px;
        }

        .footer-text a {
            color: var(--secondary);
            text-decoration: none;
            transition: color 0.3s;
            cursor: pointer;
            font-weight: bold;
        }

        .footer-text a:hover {
            color: var(--primary);
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .back-btn:hover {
            background: var(--primary);
            transform: scale(1.1);
        }

        .message-box {
            display: none;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 14px;
            text-align: center;
        }

        /* Signup Steps */
        .step-container {
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Staggered Animation */
        .login-card-front > *, .login-card-back > * {
            opacity: 0;
            animation: fadeInUp 0.8s ease forwards;
        }

        .login-card-front > *:nth-child(1) { animation-delay: 0.1s; } /* Decoration */
        .login-card-front > *:nth-child(2) { animation-delay: 0.2s; } /* h2 */
        .login-card-front > *:nth-child(3) { animation-delay: 0.3s; } /* p */
        .login-card-front > *:nth-child(4) { animation-delay: 0.4s; } /* form */
        .login-card-front > *:nth-child(5) { animation-delay: 0.5s; } /* divider */
        .login-card-front > *:nth-child(6) { animation-delay: 0.6s; } /* google */
        .login-card-front > *:nth-child(7) { animation-delay: 0.7s; } /* footer */

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
            animation: floatParticle 10s infinite linear;
        }

        @keyframes floatParticle {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

    </style>
    <!-- Open Graph Tags (WhatsApp Preview) -->
    <meta property="og:title" content="PageBook - تسجيل الدخول">
    <meta property="og:description" content="منصة الفيديوهات الرائدة. سجل دخولك الآن.">
    <meta property="og:image" content="pagebook.jpg">
    <meta property="og:type" content="website">
    
    <!-- Security & Protection -->
    <script src="protection.js"></script>
</head>
<body>

    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="login-container" id="flipContainer">
        <div class="flip-card-inner">
            
            <!-- FRONT: LOGIN -->

                <div class="card-decoration"></div>
                
                <!-- Logo removed as per user request -->
                <h2>تسجيل الدخول</h2>

                </form>

                <div class="divider" style="display: flex; align-items: center; margin-bottom: 15px; color: var(--text-muted); font-size: 14px;">
                    <span style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></span>

            <!-- BACK: SIGNUP -->
            <div class="login-card-back">

                            <span style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></span>
                            <span style="padding: 0 10px; font-size: 12px; color: #aaa;">أو</span>
                            <span style="flex: 1; height: 1px; background: rgba(255,255,255,0.1);"></span>
                        </div>
                        
                        <button class="google-btn" id="btnGoogleSignup">
                            <i class="fab fa-google"></i>
                            <span>تسجيل عبر Google</span>
                        </button>
                    </div>

                    <!-- Step 2: OTP for Signup -->
                    <div id="signupOtpContainer" class="step-container" style="display: none;">
                        <p style="color: #eee; font-size: 14px; margin-bottom: 15px;">تم إرسال الرمز إلى بريدك الإلكتروني</p>
                        <div class="input-wrapper">
                            <input type="text" id="signupOtpCode" class="input-field" placeholder="رمز التحقق (مثال: 123456)">
                        </div>
                        <button type="button" id="btnVerifySignup" class="submit-btn">تأكيد الرمز</button>
                        <button type="button" id="btnResetSignup" style="background: none; border: none; color: var(--accent); cursor: pointer; text-decoration: underline; margin-top: 10px;">تغيير البريد الإلكتروني</button>
                    </div>
                </form>

                <p class="footer-text">
                    لديك حساب بالفعل؟ 
                    <a onclick="toggleFlip()">تسجيل الدخول</a>
                </p>
            </div>

        </div>
    </div>

    <!-- Back Button -->
    <a href="index.html" class="back-btn" title="العودة للصفحة الرئيسية">
        <i class="fas fa-arrow-right"></i>
    </a>

    <!-- Design Switcher -->
    <div class="design-switcher">
        <a href="login.html" class="design-btn active" title="النظام المتحرك">1</a>
        <a href="login2.html" class="design-btn" title="شريط جانبي">2</a>
        <a href="login3.html" class="design-btn" title="أمواج متدرجة">3</a>
        <a href="login4.html" class="design-btn" title="ريترو المستقبل">4</a>
    </div>

    <!-- Supabase Auth -->
    <script>
        const flipContainer = document.getElementById('flipContainer');
        // Using classes as IDs are not present in the HTML structure provided
        const frontCard = document.querySelector('.login-card-front');
        const backCard = document.querySelector('.login-card-back');

        function toggleFlip() {
            // Check if mobile (using the CSS check or window width)
            if (window.innerWidth <= 768) {
                // Mobile toggle
                if (frontCard.classList.contains('active')) {
                    frontCard.classList.remove('active');
                    backCard.classList.add('active');
                } else {
                    backCard.classList.remove('active');
                    frontCard.classList.add('active');
                }
            } else {
                // Desktop flip
                flipContainer.classList.toggle('flipped');
            }
        }

        // Particle System
        function createParticles() {
            const container = document.querySelector('.background-orbs');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random size
                const size = Math.random() * 5 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                
                // Random position
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                
                // Random animation duration and delay
                const duration = Math.random() * 10 + 10; // 10-20s
                const delay = Math.random() * 5;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `-${delay}s`;
                
                container.appendChild(particle);
            }
        }
        
        createParticles();

        // Parallax Effect for Orbs
        document.addEventListener('mousemove', (e) => {
            const orbs = document.querySelectorAll('.orb');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 20; // Different speed for each orb
                const xOffset = (x - 0.5) * speed;
                const yOffset = (y - 0.5) * speed;
                
                orb.style.transform = `translate(${xOffset}px, ${yOffset}px) scale(${index === 1 ? 1.1 : 1})`;
            });
        });
    </script>

    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Core Modules (Load in correct order) -->
    <script src="utils-secure.js"></script>

            }
        });
    </script>
