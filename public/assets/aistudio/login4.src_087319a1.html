<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Retro Future</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Retro Future Login Form */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a0a2e 0%, #16213e 25%, #0f3460 50%, #533483 75%, #e94560 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Retro Background */
        .retro-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .grid-dots {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(255, 255, 0, 0.3) 1px, transparent 0);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
        }

        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(40px, 40px); }
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
        }

        .future-card {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            text-align: center;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .chrome-header { margin-bottom: 30px; }

        .retro-logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border: 2px solid #00ffff;
            box-shadow: 0 0 15px #00ffff;
        }

        .retro-logo i {
            font-size: 30px;
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .y2k-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(45deg, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }

        /* Tabs */
        .tabs-container {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-family: 'Cairo', sans-serif;
        }

        .tab-btn.active {
            color: #000;
            background: #00ffff;
            box-shadow: 0 0 15px #00ffff;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 20px;
            text-align: right;
            position: relative;
        }

        .form-group i {
            position: absolute;
            top: 50%; /* Center icon vertically */
            right: 15px; /* RTL Icon */
            transform: translateY(20%); /* Adjust based on label height */
            color: #00ffff;
            z-index: 2;
        }
        
        .form-group label {
            display: block;
            color: #00ffff;
            margin-bottom: 8px;
            font-size: 12px;
            font-weight: 600;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .auth-input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid #00ffff;
            border-radius: 8px;
            color: white;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .auth-input:focus {
            outline: none;
            background: rgba(0, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid #ff00ff;
            border-radius: 8px;
            color: #ff00ff;
            font-weight: 700;
            font-size: 16px;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            text-shadow: 0 0 5px #ff00ff;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.2);
        }

        .submit-btn:hover {
            background: rgba(255, 0, 255, 0.1);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
            transform: translateY(-2px);
        }

        .google-btn {
            width: 100%;
            background: white;
            color: #333;
            border: none;
            border-radius: 8px;
            padding: 12px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .divider span {
            padding: 0 10px;
        }

        /* Message Box */
        .message-box {
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            display: none;
            text-align: center;
            border: 1px solid;
        }

        /* Sections */
        .form-section { display: none; }
        .form-section.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Switcher & Back Btn */
        .design-switcher {
            position: fixed;
            top: 20px;
            right: 80px;
            z-index: 10000;
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .design-btn {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            color: white;
            font-weight: bold;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
        }
        
        .design-btn:hover, .design-btn.active {
            background: #00ffff;
            color: black;
            transform: scale(1.1);
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .back-btn:hover {
            background: #00ffff;
            color: #000;
            transform: scale(1.1);
            box-shadow: 0 0 15px #00ffff;
        }


    </style>
    <!-- Open Graph Tags (WhatsApp Preview) -->
    <meta property="og:title" content="PageBook - تسجيل الدخول">
    <meta property="og:description" content="منصة الفيديوهات الرائدة. سجل دخولك الآن.">
    <meta property="og:image" content="pagebook.jpg">
    <meta property="og:type" content="website">
    
    <!-- Security & Protection -->
    <script src="protection.js"></script>
</head>
<body>

    <div class="retro-background">
        <div class="grid-dots"></div>
    </div>

    <div class="design-switcher">
        <a href="login.html" class="design-btn" title="قلب ثلاثي الأبعاد">1</a>
        <a href="login2.html" class="design-btn" title="لوحة جانبية">2</a>
        <a href="login3.html" class="design-btn" title="ماتريكس">3</a>
        <a href="login4.html" class="design-btn active" title="ريترو">4</a>
    </div>

    <a href="index.html" class="back-btn" title="العودة للرئيسية">
        <i class="fas fa-arrow-right"></i>
    </a>

    <div class="login-container">
        <div class="future-card">
            <div class="chrome-header">
                <div class="retro-logo">
                    <i class="fas fa-bolt"></i>
                </div>
                <h1 class="y2k-title">CYBER AUTH</h1>
            </div>

            <div class="tabs-container">
                <button class="tab-btn active" id="tab-login">تسجيل الدخول</button>
                <button class="tab-btn" id="tab-signup">حساب جديد</button>
            </div>

            <div id="messageBox" class="message-box"></div>

            <!-- Login -->
            <div id="loginSection" class="form-section active">
                <div class="form-group">
                    <label>البريد الإلكتروني // EMAIL</label>
                    <input type="email" class="auth-input" id="loginEmail" placeholder="name@example.com">
                    <i class="fas fa-envelope"></i>
                </div>
                
                <div class="form-group">
                    <label>كلمة المرور // PASSWORD</label>
                    <input type="password" class="auth-input" id="loginPassword" placeholder="******">
                    <i class="fas fa-lock"></i>
                </div>

                <button class="submit-btn" id="btnLogin">
                    INITIALIZE LOGIN
                </button>
                
                <div class="divider"><span>OR SYSTEM</span></div>
                
                <button class="google-btn" id="btnGoogleLogin">
                    <i class="fab fa-google" style="color: #DB4437;"></i>
                    <span>GOOGLE ACCESS</span>
                </button>
            </div>

            <!-- Signup -->
            <div id="signupSection" class="form-section">
                <div id="signupStep1">
                    <div class="form-group">
                        <label>البريد الإلكتروني // EMAIL</label>
                        <input type="email" class="auth-input" id="signupEmail" placeholder="name@example.com">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <button class="submit-btn" id="btnSendCode">SEND VERIFICATION</button>
                    <div class="divider"><span>OR</span></div>
                    <button class="google-btn" id="btnGoogleSignup">
                        <i class="fab fa-google" style="color: #DB4437;"></i>
                        <span>GOOGLE REGISTER</span>
                    </button>
                </div>

                <div id="signupStep2" style="display: none;">
                    <p style="color: #00ffff; font-size: 12px; margin-bottom: 10px;">CODE SENT TO YOUR EMAIL</p>
                    <div class="form-group">
                        <label>رمز التحقق // CODE</label>
                        <input type="text" class="auth-input" id="otpCode" placeholder="123456">
                        <i class="fas fa-key"></i>
                    </div>
                    <button class="submit-btn" id="btnVerifyCode">VERIFY IDENTITY</button>
                    <button class="tab-btn" style="width: 100%; font-size: 10px;" id="btnResetSignup">CHANGE EMAIL</button>
                </div>

                <div id="signupStep3" style="display: none;">
                    <div class="form-group">
                        <label>كلمة المرور // NEW PASS</label>
                        <input type="password" class="auth-input" id="newPassword" placeholder="******">
                        <i class="fas fa-lock"></i>
                    </div>
                    <div class="form-group">
                        <label>تأكيد كلمة المرور // CONFIRM</label>
                        <input type="password" class="auth-input" id="confirmPassword" placeholder="******">
                        <i class="fas fa-lock"></i>
                    </div>
                    <button class="submit-btn" id="btnCreateAccount">CREATE IDENTITY</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="utils-secure.js"></script>
    <script src="config-secure.js"></script>
    <script src="auth-secure.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ui = {
                btnLogin: document.getElementById('btnLogin'),
                btnGoogleLogin: document.getElementById('btnGoogleLogin'),
                btnSendCode: document.getElementById('btnSendCode'),
                btnVerifyCode: document.getElementById('btnVerifyCode'),
                btnCreateAccount: document.getElementById('btnCreateAccount'),
                btnGoogleSignup: document.getElementById('btnGoogleSignup'),
                btnResetSignup: document.getElementById('btnResetSignup'),
                
                loginEmail: document.getElementById('loginEmail'),
                loginPassword: document.getElementById('loginPassword'),
                signupEmail: document.getElementById('signupEmail'),
                otpCode: document.getElementById('otpCode'),
                newPassword: document.getElementById('newPassword'),
                confirmPassword: document.getElementById('confirmPassword'),
                
                messageBox: document.getElementById('messageBox'),
                step1: document.getElementById('signupStep1'),
                step2: document.getElementById('signupStep2'),
                step3: document.getElementById('signupStep3'),
    
                switchToSignup: () => document.getElementById('tab-signup').click()
            };
    
            const auth = new AuthHandler(ui);
        });

        // Tab Logic
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const loginSection = document.getElementById('loginSection');
        const signupSection = document.getElementById('signupSection');
        const messageBox = document.getElementById('messageBox');

        function switchTab(tab) {
            messageBox.style.display = 'none';
            if (tab === 'login') {
                tabLogin.classList.add('active');
                tabSignup.classList.remove('active');
                loginSection.classList.add('active');
                signupSection.classList.remove('active');
            } else {
                tabSignup.classList.add('active');
                tabLogin.classList.remove('active');
                signupSection.classList.add('active');
                loginSection.classList.remove('active');
            }
        }

        tabLogin.addEventListener('click', () => switchTab('login'));
        tabSignup.addEventListener('click', () => switchTab('signup'));
    </script>
</body>
</html>
