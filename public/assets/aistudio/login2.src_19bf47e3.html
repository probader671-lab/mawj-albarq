<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - PageBook</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #573b8a;
            --secondary: #6d44b8;
            --white: #ffffff;
            --gray: #f0f0f0;
            --text: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Container */
        .container {
            background-color: var(--white);
            border-radius: 20px;
            box-shadow: 0 14px 28px rgba(0,0,0,0.25), 
                        0 10px 10px rgba(0,0,0,0.22);
            position: relative;
            overflow: hidden;
            width: 850px;
            max-width: 100%;
            min-height: 550px;
        }

        .form-container {
            position: absolute;
            top: 0;
            height: 100%;
            transition: all 0.6s ease-in-out;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0 50px;
            text-align: center;
        }

        /* تسجيل الدخول (على اليمين في RTL - ظاهر أولاً) */
        .sign-in-container {
            left: auto;
            right: 0;
            width: 50%;
            z-index: 2;
        }

        /* إنشاء حساب (على اليسار في RTL - مخفي أولاً) */
        .sign-up-container {
            right: auto;
            left: 0;
            width: 50%;
            opacity: 0;
            z-index: 1;
        }

        /* عند تفعيل اللوحة (للانتقال إلى التسجيل) */
        .container.right-panel-active .sign-in-container {
            transform: translateX(100%); /* تتحرك لليمين */
            opacity: 0;
        }

        .container.right-panel-active .sign-up-container {
            transform: translateX(0); /* Stay on Left to be revealed */
            opacity: 1;
            z-index: 5;
            animation: show 0.6s;
        }

        @keyframes show {
            0%, 49.99% {
                opacity: 0;
                z-index: 1;
            }
            50%, 100% {
                opacity: 1;
                z-index: 5;
            }
        }

        /* RTL Form Alignment Re-added */
        .sign-in-container form, .sign-up-container form {
            align-items: flex-start; /* Align Right in RTL */
            text-align: right;
        }

        .social-container {
            margin: 15px 0;
            width: 100%;
            display: flex;
            justify-content: flex-start; /* Align icons to right */
        }

        form h1 {
            width: 100%;
            text-align: right;
        }
        
        form span {
            width: 100%;
            text-align: right;
            margin-bottom: 10px;
        }
        
        form a {
            align-self: flex-start; /* Align link to right */
        }
        
        form button {
            align-self: flex-start; /* Align buttons to right */
            width: 100%; 
        }

        /* Overlay */
        .overlay-container {
            position: absolute;
            top: 0;
            left: 0; /* Start at Left */
            width: 50%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.6s ease-in-out;
            z-index: 100;
        }

        .container.right-panel-active .overlay-container {
            transform: translateX(100%); /* Move to Right */
        }

        .overlay {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            position: relative;
            right: 0; /* بداية من اليمين */
            height: 100%;
            width: 200%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
            color: #fff;
        }

        .glow-text {
            font-size: 2.5rem;
            color: #fff;
            text-align: center;
            animation: glow 2s ease-in-out infinite alternate;
            margin-bottom: 20px;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #573b8a;
            }
            to {
                text-shadow: 0 0 20px #fff, 0 0 30px #ff4da6, 0 0 40px #ff4da6;
            }
        }

        /* Secondary Button for Form triggers */
        button.secondary {
            background-color: transparent;
            border: 2px solid #573b8a;
            color: #573b8a;
            margin-top: 15px;
        }
        
        button.secondary:hover {
            background-color: #573b8a;
            color: #ffffff;
        }

        .container.right-panel-active .overlay {
            transform: translateX(50%); /* تتحرك لليسار بنسبة 50% */
        }

        .overlay-panel {
            position: absolute;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 40px;
            text-align: center;
            top: 0;
            height: 100%;
            width: 50%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
            overflow: hidden; /* Prevent text spillover */
        }

        /* Improved Text Animation */
        .overlay-panel h1, .overlay-panel p, .overlay-panel button {
            transition: transform 0.6s ease-in-out, opacity 0.6s ease-in-out;
            opacity: 0;
            transform: translateY(20px);
        }

        /* Active Text State - when panel is visible */
        .container:not(.right-panel-active) .overlay-left h1,
        .container:not(.right-panel-active) .overlay-left p,
        .container:not(.right-panel-active) .overlay-left button {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.3s; /* Delay to wait for panel slide */
        }

        .container.right-panel-active .overlay-right h1,
        .container.right-panel-active .overlay-right p,
        .container.right-panel-active .overlay-right button {
            opacity: 1;
            transform: translateY(0);
            transition-delay: 0.3s;
        }

        /* Refined Glow Text */
        .glow-text {
            font-size: 2.2rem;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            background: linear-gradient(to bottom, #fff, #e0e0e0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .overlay-left {
            right: 0; /* على اليمين في البداية */
            transform: translateX(0);
        }

        /* اللوحة اليمنى (التي تحتوي على "هل لديك حساب") */
        .overlay-right {
            left: 0; /* على اليسار في البداية */
            transform: translateX(20%);
        }

        /* عند تفعيل اللوحة */
        .container.right-panel-active .overlay-left {
            transform: translateX(-20%); /* تتحرك قليلاً لليسار */
        }

        .container.right-panel-active .overlay-right {
            transform: translateX(0); /* تصبح ظاهرة */
        }

        /* Elements */
        h1 {
            font-weight: bold;
            margin: 0;
            margin-bottom: 10px;
        }

        p {
            font-size: 14px;
            font-weight: 300;
            line-height: 20px;
            letter-spacing: 0.5px;
            margin: 20px 0 30px;
        }

        span {
            font-size: 12px;
        }

        a {
            color: #333;
            font-size: 14px;
            text-decoration: none;
            margin: 15px 0;
        }

        button {
            border-radius: 20px;
            border: 1px solid #573b8a;
            background-color: #573b8a;
            color: #ffffff;
            font-size: 12px;
            font-weight: bold;
            padding: 12px 45px;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 80ms ease-in;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            margin-top: 10px;
        }

        button:active {
            transform: scale(0.95);
        }

        button:focus {
            outline: none;
        }

        button.ghost {
            background-color: transparent;
            border-color: #ffffff;
        }

        form {
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            padding: 0 50px;
            height: 100%;
            text-align: center;
            width: 100%;
        }

        input {
            background-color: #eee;
            border: none;
            padding: 12px 15px;
            margin: 8px 0;
            width: 100%;
            border-radius: 8px;
            font-family: 'Cairo', sans-serif;
            text-align: right;
        }

        .social-container {
            margin: 20px 0;
        }

        .social-container a {
            border: 1px solid #dddddd;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin: 0 5px;
            height: 40px;
            width: 40px;
            color: #333;
            transition: all 0.3s;
        }

        .social-container a:hover {
            background: #eee;
            transform: scale(1.1);
        }

        /* Design Switcher */
        .design-switcher {
            position: fixed;
            top: 50%;
            right: 30px;
            transform: translateY(-50%);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            gap: 20px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            padding: 25px 15px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        
        .design-btn {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            text-decoration: none;
            color: #ffffff;
            font-weight: 800;
            font-size: 18px;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            background: rgba(0, 0, 0, 0.2);
            font-family: 'Cairo', sans-serif;
            border: 2px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        
        .design-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            transform: scale(0);
            transition: transform 0.3s ease;
        }

        .design-btn:hover::after {
            transform: scale(1.5);
        }
        
        .design-btn:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        .design-btn.active {
            background: #ffffff;
            color: #573b8a;
            transform: scale(1.2);
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            width: 40px;
            height: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .back-btn:hover {
            background: #573b8a;
            transform: scale(1.1);
        }

        /* Google Button Style Override */
        .google-btn-custom {
            background: white;
            color: #333;
            border: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .google-btn-custom:hover {
            background: #f8f8f8;
        }

        #messageBox {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
            width: 80%;
            z-index: 150;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .message-box.error {
            background-color: #ff6b6b;
            color: white;
        }
        .message-box.success {
            background-color: #51cf66;
            color: white;
        }

        /* Step Containers */
        .step-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Switch Links */
        .mobile-switch {
            display: none;
            margin-top: 20px;
            font-size: 14px;
        }
        .mobile-switch a {
            color: #573b8a;
            font-weight: bold;
            cursor: pointer;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                min-height: 600px;
                height: auto;
            }
            .form-container {
                width: 100%;
                left: 0 !important;
                right: 0 !important;
                position: absolute;
                top: 0;
                transition: all 0.5s ease;
            }
            .sign-in-container {
                z-index: 2;
                opacity: 1;
            }
            .sign-up-container {
                z-index: 1;
                opacity: 0;
            }
            .container.right-panel-active .sign-in-container {
                transform: translateX(100%);
                opacity: 0;
                z-index: 1;
            }
            .container.right-panel-active .sign-up-container {
                transform: translateX(0);
                opacity: 1;
                z-index: 5;
                animation: none;
            }
            .overlay-container {
                display: none;
            }
            .mobile-switch {
                display: block;
            }
        }

    </style>
    <!-- Open Graph Tags (WhatsApp Preview) -->
    <meta property="og:title" content="PageBook - تسجيل الدخول">
    <meta property="og:description" content="منصة الفيديوهات الرائدة. سجل دخولك الآن.">
    <meta property="og:image" content="pagebook.jpg">
    <meta property="og:type" content="website">
    
    <!-- Security & Protection -->
    <script src="protection.js"></script>
</head>
<body>

    <div class="container" id="container">
        <!-- Sign In Container (Right in RTL Logic) -->
        <div class="form-container sign-in-container">
            <form onsubmit="event.preventDefault()">
                <h1>تسجيل الدخول</h1>
                <div class="social-container">
                    <a href="#" id="btnGoogleLogin" class="social"><i class="fab fa-google"></i></a>
                </div>
                <span>أو استخدم حسابك الخاص</span>
                
                <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" />
                <input type="password" id="loginPassword" placeholder="كلمة المرور" />
                
                <a href="#">هل نسيت كلمة المرور؟</a>
                <button type="button" id="btnLogin">تسجيل الدخول</button>
                <div class="mobile-switch">
                    <span>ليس لديك حساب؟</span>
                    <a id="mobileSwitchToSignup">إنشاء حساب</a>
                </div>
            </form>
        </div>

        <!-- Sign Up Container (Left in RTL Logic) -->
        <div class="form-container sign-up-container">
            <form onsubmit="event.preventDefault()">
                <h1>إنشاء حساب</h1>
                <div class="social-container">
                    <a href="#" id="btnGoogleSignup" class="social"><i class="fab fa-google"></i></a>
                </div>
                <span>أو استخدم بريدك الإلكتروني للتسجيل</span>
                
                <div id="signupForm">
                    <input type="email" id="signupEmail" placeholder="البريد الإلكتروني" />
                    <input type="password" id="signupPassword" placeholder="كلمة المرور" />
                    <input type="password" id="signupConfirmPassword" placeholder="تأكيد كلمة المرور" />
                    <button type="button" id="btnCreateAccount">إنشاء حساب</button>
                </div>

                <div id="otpContainer" style="display: none; width: 100%;">
                    <p>أدخل رمز التحقق</p>
                    <input type="text" id="otpCode" placeholder="رمز التحقق" />
                    <button type="button" id="btnVerifyCode">تأكيد الرمز</button>
                </div>
                <div class="mobile-switch">
                    <span>لديك حساب بالفعل؟</span>
                    <a id="mobileSwitchToLogin">تسجيل الدخول</a>
                </div>
            </form>
        </div>

        <!-- Overlay -->
        <div class="overlay-container">
            <div class="overlay">
                <!-- اللوحة اليسرى (على اليمين في البداية - "ليس لديك حساب") -->
                <div class="overlay-panel overlay-left">
                    <h1 class="glow-text">ليس لديك حساب؟</h1>
                    <p>انضم إلينا الآن وابدأ رحلتك معنا</p>
                    <button class="ghost" id="overlaySignUp">إنشاء حساب جديد</button>
                </div>
                
                <!-- اللوحة اليمنى (على اليسار في البداية - "هل لديك حساب") -->
                <div class="overlay-panel overlay-right">
                    <h1 class="glow-text">هل لديك حساب بالفعل؟</h1>
                    <p>سجل الدخول الآن لتبقى على اتصال</p>
                    <button class="ghost" id="overlaySignIn">تسجيل الدخول</button>
                </div>
            </div>
        </div>
        
        <!-- Shared Message Box -->
        <div id="messageBox" style="display:none;"></div>
    </div>

    <!-- Design Switcher -->
    <div class="design-switcher">
        <a href="login.html" class="design-btn" title="النظام المتحرك">1</a>
        <a href="login2.html" class="design-btn active" title="شريط جانبي">2</a>
        <a href="login3.html" class="design-btn" title="أمواج متدرجة">3</a>
        <a href="login4.html" class="design-btn" title="ريترو المستقبل">4</a>
    </div>

    <!-- Back Button -->
    <a href="index.html" class="back-btn" title="العودة للصفحة الرئيسية">
        <i class="fas fa-arrow-right"></i>
    </a>

    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- UI Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('container');
            const overlaySignUpBtn = document.getElementById('overlaySignUp');
            const overlaySignInBtn = document.getElementById('overlaySignIn');
            const formSignUpBtn = document.getElementById('formSignUp');

            function togglePanel(showSignup) {
                if (showSignup) {
                    container.classList.add("right-panel-active");
                } else {
                    container.classList.remove("right-panel-active");
                }
            }

            if(overlaySignUpBtn) overlaySignUpBtn.addEventListener('click', () => togglePanel(true));
            if(overlaySignInBtn) overlaySignInBtn.addEventListener('click', () => togglePanel(false));
            if(formSignUpBtn) formSignUpBtn.addEventListener('click', () => togglePanel(true));

            // Mobile Switch Logic
            const mobileSwitchToSignup = document.getElementById('mobileSwitchToSignup');
            const mobileSwitchToLogin = document.getElementById('mobileSwitchToLogin');
            if(mobileSwitchToSignup) mobileSwitchToSignup.addEventListener('click', () => togglePanel(true));
            if(mobileSwitchToLogin) mobileSwitchToLogin.addEventListener('click', () => togglePanel(false));
        });
    </script>

    <script src="utils-secure.js"></script>
    <script src="config-secure.js"></script>
    <script src="auth-secure.js"></script>
    <script>
        // Global AuthManager usage
        document.addEventListener('DOMContentLoaded', () => {
             const ui = {
                isSimpleSignup: true,
                btnLogin: document.getElementById('btnLogin'),
                btnGoogleLogin: document.getElementById('btnGoogleLogin'),
                btnCreateAccount: document.getElementById('btnCreateAccount'),
                btnGoogleSignup: document.getElementById('btnGoogleSignup'),
                
                loginEmail: document.getElementById('loginEmail'),
                loginPassword: document.getElementById('loginPassword'),
                
                signupName: document.getElementById('signupName'),
                signupEmail: document.getElementById('signupEmail'),
                signupPassword: document.getElementById('signupPassword'),
                
                messageBox: document.getElementById('messageBox'),
    
                switchToSignup: () => {
                    const container = document.getElementById('container');
                    if(container) container.classList.add("right-panel-active");
                }
            };
    
            try {
                const auth = new AuthHandler(ui);
            } catch (e) {
                console.error("Auth init failed:", e);
            }
        });
    </script>
</body>
</html>
